[package]
name = "aura-shell"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/taozhihaoo/ifuyo-aura"
description = "ifuyo Aura Tauri shell"
default-run = "aura-shell"


[lib]
name = "aura_shell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
aura-library = { version = "0.1.0", path = "../crates/aura-library" }
aura-synth = { version = "0.1.0", path = "../crates/aura-synth" }
aura-sources = { version = "0.1.0", path = "../crates/aura-sources" }
url = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
aura-core = { version = "0.1.0", path = "../crates/aura-core" }
rusqlite = { version = "0.40.2", features = ["bundled"] }
tauri-plugin-dialog = "2"
base64 = "0.22"
window-vibrancy = "0.5"

[features]
# 生产构建内嵌 ui/dist（tauri CLI 等价行为）；裸 cargo build 默认 devUrl。
custom-protocol = ["tauri/custom-protocol"]

[dev-dependencies]
tauri = { version = "2", features = ["test"] }

# Tauri 版本由 Cargo.lock 锁定；升级走显式决策（DECISIONS.md）。
