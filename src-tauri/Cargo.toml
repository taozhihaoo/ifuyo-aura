[package]
name = "aura-shell"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/taozhihaoo/ifuyo-aura"
description = "ifuyo Aura Tauri shell"

[lib]
name = "aura_shell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

# Tauri 版本由 Cargo.lock 锁定；升级走显式决策（DECISIONS.md）。
