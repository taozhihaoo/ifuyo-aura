# cargo-deny 配置：许可证 / 依赖 / 来源门禁
# CI 命令：cargo deny check
# 政策依据：Charter §7、THIRD_PARTY_LICENSES.md

[licenses]
version = 2
# 允许清单与 Charter §7 一致；新增许可证必须先记录到 DECISIONS.md
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MPL-2.0",
    "Zlib",
    "CC0-1.0",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    "OFL-1.1",
]
# GPL / AGPL / LGPL 不在 allow 清单中即被拒绝

[bans]
multiple-versions = "warn"
wildcards = "deny"

[advisories]
version = 2
yanked = "warn"

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
