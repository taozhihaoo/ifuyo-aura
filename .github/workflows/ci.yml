# ifuyo Aura CI skeleton（Phase 0 §19）
#
# 预留全部门禁命令。本阶段状态（详见 PROGRESS.md）：
# - rust / frontend / deny job：命令就绪，push 到 GitHub 后即真实运行。
# - tauri-build job：src-tauri 尚未接线（DECISIONS D-010），M0 激活；
#   当前以 `if: false` 保留占位，不伪造 PASS。
# - 本地无 Rust 工具链，cargo 类门禁首次真实执行发生在 CI / M0。

name: CI

# §41：最小权限——默认只读 contents；各 job 不接触生产 secrets
# （签名 secrets 仅 release.yml 的 build job 使用，§62）。
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

  # §29：成熟 secret scanning（gitleaks；全 history 扫描 §28）。
  gitleaks:
    name: Secret scan (gitleaks §29)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  rust:
    name: Rust (fmt / clippy / test)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt --check
        run: cargo fmt --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo test
        run: cargo test --workspace

  deny:
    name: cargo deny
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: cargo deny check
        run: cargo deny check

  audit:
    name: dependency audit（§40/§58）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: install cargo-audit
        run: cargo install cargo-audit --locked
      - name: cargo audit（已知 warnings=paste/proc-macro-error/glib，见 docs/SUPPLY_CHAIN.md）
        run: cargo audit
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: npm audit（生产依赖门；dev 工具链已知项分类见 docs/SUPPLY_CHAIN.md §40）
        run: npm audit --omit=dev
        working-directory: ui

  frontend:
    name: Frontend (typecheck / lint / test)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: npm ci
        run: npm ci
      - name: version:check（§A1 版本权威）
        run: npm run version:check
      - name: typecheck
        run: npm run typecheck
      - name: lint
        run: npm run lint
      - name: test
        run: npm test

  tauri-build:
    name: tauri build
    runs-on: windows-latest
    # M0-3 已将 src-tauri 接入 workspace（cargo check/clippy/test 由上方 rust job 覆盖）。
    # 完整 tauri build（含打包）在 UI 落地后（M6）激活：改为 `if: true` 或移除本行。
    if: false
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: npm ci
        run: npm ci
        working-directory: ui
      - name: tauri build
        run: |
          cargo install tauri-cli --locked
          cargo tauri build
