# ifuyo Aura CI（§19）
#
# 当前状态（M15b）：
# - rust / frontend / deny / audit / gitleaks：全部真实运行，失败即红。
# - tauri-build：完整打包由 release.yml 的 build job 覆盖，CI 不重复执行，
#   仍以 `if: false` 保留占位（不是伪造 PASS，见下方注释）。

name: CI

# §41：最小权限——默认只读 contents；各 job 不接触生产 secrets
# （签名 secrets 仅 release.yml 的 build job 使用，§62）。
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # §29：成熟 secret scanning（gitleaks；全 history 扫描 §28）。
  # `pull-requests: read` 用于 PR 基线比对；组织仓库需另配
  # GITLEAKS_LICENSE secret（个人仓库免费，不必设置）。
  gitleaks:
    name: Secret scan (gitleaks §29)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  rust:
    name: Rust (fmt / clippy / test)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt --check
        run: cargo fmt --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo test
        run: cargo test --workspace

  deny:
    name: cargo deny
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: cargo deny check
        run: cargo deny check

  audit:
    name: dependency audit（§40/§58）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: install cargo-audit
        run: cargo install cargo-audit --locked
      - name: cargo audit（已知 warnings=paste/proc-macro-error/glib，见 docs/SUPPLY_CHAIN.md）
        run: cargo audit
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: npm audit（生产依赖门；dev 工具链已知项分类见 docs/SUPPLY_CHAIN.md §40）
        run: npm audit --omit=dev
        working-directory: ui

  frontend:
    name: Frontend (typecheck / lint / test)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: npm ci
        run: npm ci
      - name: version:check（§A1 版本权威）
        run: npm run version:check
      - name: typecheck
        run: npm run typecheck
      - name: lint
        run: npm run lint
      - name: test
        run: npm test

  tauri-build:
    name: tauri build
    runs-on: windows-latest
    # src-tauri 已接入 workspace（fmt/clippy/test 由 rust job 覆盖）；完整打包
    # 在 release.yml 的 build job（tag 触发、含签名）执行。此处保留占位，
    # 避免每次 push 重复十几分钟的 Windows 打包。
    if: false
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: npm ci
        run: npm ci
        working-directory: ui
      - name: tauri build
        run: |
          cargo install tauri-cli --locked
          cargo tauri build
