# M11 Release Pipeline（§18/§20/§55/§78/§112）
#
# 触发：app-v* tag（§20 明确版本 tag）。
# 阶段：validate → test → build → verify → draft-release（§18 分段；
#       §55 draft 留验证阶段，人工 publish）。
#
# Fail-closed（§21/§78）：
#   - 任何 validate/test/verify 失败 → 不发布。
#   - 生产签名 secrets（TAURI_UPDATER_PUBKEY / TAURI_SIGNING_PRIVATE_KEY）
#     缺失 → signed-build job 显式 FAIL（不生成随机证书/不伪装生产）；
#     unsigned dry-run 由独立 workflow/dispatch 承担（§78）。
#
# 签名两类（§24）：Tauri updater signature（minisign，CI secret）≠
# Windows Authenticode（production 证书缺失时如实 BLOCKED，见
# CODE_SIGNING_POLICY.md / RELEASE.md）。

name: Release

on:
  push:
    tags:
      - 'app-v*'

permissions:
  contents: write

jobs:
  validate:
    name: Validate (version / changelog)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: npm ci
        run: npm ci
      - name: version:check（含 tag 比对 §A1）
        run: npm run version:check
      - name: changelog contains version（§82）
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME -replace '^app-v', ''
          $cl = Get-Content ../CHANGELOG.md -Raw
          if ($cl -notmatch [regex]::Escape($tag)) {
            Write-Error "CHANGELOG 缺少版本 $tag 段落（§82）"
          }

  test:
    name: Test (Rust / frontend)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: cargo fmt --check
        run: cargo fmt --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo test
        run: cargo test --workspace --locked
      - name: frontend gates
        run: |
          npm ci
          npm run typecheck
          npm run lint
          npm test
          npm run build
        working-directory: ui

  build:
    name: Build + bundle + updater artifacts (signed, fail-closed §78)
    runs-on: windows-latest
    needs: [validate, test]
    env:
      TAURI_UPDATER_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Secret guard（§78：缺生产 updater 公钥/私钥 → fail closed）
        shell: pwsh
        run: |
          if (-not $env:TAURI_UPDATER_PUBKEY) { Write-Error "TAURI_UPDATER_PUBKEY secret 缺失（§78 fail-closed）" }
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) { Write-Error "TAURI_SIGNING_PRIVATE_KEY secret 缺失（§78 fail-closed）" }
      - name: Prepare release config（overlay：updater artifacts + 生产公钥/端点 §77）
        shell: pwsh
        run: node scripts/prepare-release-config.mjs
      - name: npm ci
        run: npm ci
        working-directory: ui
      - name: tauri build（locked；--config overlay）
        run: |
          cargo install tauri-cli --locked
          npx tauri build --config target/tauri.release.conf.json
        working-directory: ui
      - name: Verify artifacts（§22：存在/非零/版本/架构/签名）
        shell: pwsh
        run: node scripts/release-verify.mjs
      - name: Upload bundle（draft release 附件 §55）
        uses: actions/upload-artifact@v4
        with:
          name: release-bundle
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/**/*.zip
            target/release/bundle/**/*.sig
            target/release/bundle/**/latest.json
          if-no-files-found: error

  draft-release:
    name: Draft GitHub Release（§55：先 draft 后人工 publish）
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-bundle
          path: bundle
      - name: Generate checksums（§23 SHA-256）
        shell: bash
        run: |
          cd bundle
          sha256sum * > checksums.txt
          cat checksums.txt
      - name: Draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: false
          generate_release_notes: true
          files: |
            bundle/*
